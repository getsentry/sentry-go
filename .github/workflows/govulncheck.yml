name: Go vulnerability audit
on:
  push:
    branches:
      - master
      - release/**
  pull_request:
  schedule:
    - cron: "00 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  govulncheck:
    name: Go vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          # Always use the latest stable Go so standard-library vulnerabilities
          # are checked against the newest patched toolchain.
          go-version: stable
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Show versions
        run: |
          go version
          govulncheck -version
      - name: Run govulncheck
        run: govulncheck -show verbose work

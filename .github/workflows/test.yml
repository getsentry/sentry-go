name: Test
on:
  push:
    branches:
      - master
      - release/**
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Module Mode
    runs-on: ${{ matrix.os }}-latest
    env:
      GO111MODULE: "on"
      GOFLAGS: "-mod=readonly"
      # The race detector adds considerable runtime overhead. To save time on
      # pull requests, only run this step for a single job in the matrix. For
      # all other workflow triggers (e.g., pushes to a release branch) run
      # this step for the whole matrix.
      RUN_RACE_TESTS: ${{ github.event_name != 'pull_request' || (matrix.go == '1.26' && matrix.os == 'ubuntu') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: Tidy
        run: make mod-tidy
        if: ${{ matrix.go == '1.26' }}
      - name: Build
        run: make build
      - name: Vet
        run: make vet
      - name: Test${{ env.RUN_RACE_TESTS == 'true' && ' (with race detection)' || '' }}
        run: |
          if [ "${{ matrix.os }}" = "ubuntu" ] && [ "${{ matrix.go }}" = "1.26" ]; then
            ${{ env.RUN_RACE_TESTS == 'true' && 'make test-race-coverage' || 'make test-coverage' }}
          else
            ${{ env.RUN_RACE_TESTS == 'true' && 'make test-race' || 'make test' }}
          fi
      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu' && matrix.go == '1.26' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # pin@v7.0.0
        with:
          directory: .coverage
          token: ${{ secrets.CODECOV_TOKEN }}
    timeout-minutes: 15
    strategy:
      matrix:
        go: ["1.26", "1.25"]
        os: [ubuntu, windows, macos]

  test-armv7:
    name: Module Mode (linux/arm/v7, Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    env:
      GO111MODULE: "on"
      GOFLAGS: "-mod=readonly"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm
      - name: Test all packages on armv7
        run: |
          docker run --rm -i --platform linux/arm/v7 \
            -e GO111MODULE="${GO111MODULE}" \
            -e GOFLAGS="${GOFLAGS}" \
            -e GOTOOLCHAIN=local \
            -v "$PWD":/src -w /src \
            golang:${{ matrix.go }}-bookworm bash -euxo pipefail <<'SCRIPT'
          go env GOOS GOARCH GOARM
          go test work
          SCRIPT
    timeout-minutes: 60
    strategy:
      matrix:
        go: ["1.26", "1.25"]
      fail-fast: false

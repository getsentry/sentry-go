# Warden Configuration
# https://github.com/getsentry/warden
#
# The org-wide base config already runs security-review on every PR.

version = 1

[defaults]
failOn = "off"
reportOn = "medium"

[[skills]]
name = "code-review"
incremental = true

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

[[skills]]
name = "sdk-review"
paths = ["**/*.go"]
ignorePaths = ["**/*_test.go", "**/testdata/**", "_examples/**"]
incremental = true

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false
